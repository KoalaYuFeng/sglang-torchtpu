<svg xmlns="http://www.w3.org/2000/svg" width="820" height="432" viewBox="0 0 820 432" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Layer 3: where the time saved comes from</title>
  <style>
    .bg { fill: #fcfcfb; }
    .t1 { fill: #0b0b0b; }
    .t2 { fill: #52514e; }
    .grid { stroke: #e4e3df; stroke-width: 1; }
    .zero { stroke: #6f6e69; stroke-width: 1.5; }
    .c1 { fill: #2a78d6; }
    .c2 { fill: #eb6834; }
    .c3 { fill: #1baf7a; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1a1a19; }
      .t1 { fill: #f0efec; }
      .t2 { fill: #c3c2b7; }
      .grid { stroke: #3a3936; }
      .zero { stroke: #9a9992; }
      .c1 { fill: #3987e5; }
      .c2 { fill: #d95926; }
      .c3 { fill: #199e70; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="820" height="432"/>

  <text class="t1" x="24" y="28" font-size="16" font-weight="600">Layer 3: where the time saved comes from</text>
  <text class="t2" x="24" y="48" font-size="12">Single-call device time vs the better baseline; the three changes are added in order, one segment each.</text>

  <rect class="c1" x="24" y="59" width="12" height="12"/>
  <text class="t1" x="42" y="69" font-size="12">Compute (K32Z weights)</text>
  <rect class="c2" x="200" y="59" width="12" height="12"/>
  <text class="t1" x="218" y="69" font-size="12">Communication</text>
  <rect class="c3" x="326" y="59" width="12" height="12"/>
  <text class="t1" x="344" y="69" font-size="12">Runtime hot-expert scheduling (when results are sent back)</text>

  <g class="grid">
    <line x1="180" y1="88" x2="180" y2="366"/>
    <line x1="250" y1="88" x2="250" y2="366"/>
    <line x1="390" y1="88" x2="390" y2="366"/>
    <line x1="460" y1="88" x2="460" y2="366"/>
    <line x1="530" y1="88" x2="530" y2="366"/>
    <line x1="600" y1="88" x2="600" y2="366"/>
    <line x1="670" y1="88" x2="670" y2="366"/>
  </g>

  <g font-size="12" text-anchor="end">
    <text class="t1" x="168" y="106">8 tokens / core</text>
    <text class="t2" x="168" y="120" font-size="10">decode · vs Push-K512</text>
    <text class="t1" x="168" y="146">16 tokens / core</text>
    <text class="t2" x="168" y="160" font-size="10">decode · vs Push-K512</text>
    <text class="t1" x="168" y="186">32 tokens / core</text>
    <text class="t2" x="168" y="200" font-size="10">decode · vs Push-K512</text>
    <text class="t1" x="168" y="226">64 tokens / core</text>
    <text class="t2" x="168" y="240" font-size="10">decode · vs Push-K512</text>
    <text class="t1" x="168" y="266">512 tokens / core</text>
    <text class="t2" x="168" y="280" font-size="10">prefill · vs Push-K512</text>
    <text class="t1" x="168" y="306">1024 tokens / core</text>
    <text class="t2" x="168" y="320" font-size="10">prefill · vs AllGather-K512</text>
    <text class="t1" x="168" y="346">2048 tokens / core</text>
    <text class="t2" x="168" y="360" font-size="10">prefill · vs AllGather-K512</text>
  </g>

  <!-- 8: compute 4.98 %, comm 0.44 %, net 5.4 % -->
  <rect class="c1" x="320" y="96" width="68.7" height="22"/>
  <rect class="c2" x="390.7" y="96" width="5.2" height="22"/>
  <!-- 16: compute 5.08 %, comm 0.58 %, net 5.7 % -->
  <rect class="c1" x="320" y="136" width="70.1" height="22"/>
  <rect class="c2" x="392.1" y="136" width="7.1" height="22"/>
  <!-- 32: compute 3.19 %, comm 0.50 %, net 3.7 % -->
  <rect class="c1" x="320" y="176" width="43.6" height="22"/>
  <rect class="c2" x="365.6" y="176" width="6.0" height="22"/>
  <!-- 64: compute 2.64 %, comm 0.34 %, net 3.0 % -->
  <rect class="c1" x="320" y="216" width="36.0" height="22"/>
  <rect class="c2" x="358.0" y="216" width="3.7" height="22"/>
  <!-- 512: compute 4.68 %, comm 1.64 %, net 6.3 % -->
  <rect class="c1" x="320" y="256" width="64.5" height="22"/>
  <rect class="c2" x="386.5" y="256" width="22.0" height="22"/>
  <!-- 1024: compute 15.14 %, comm -7.69 %, scheduling 8.17 %, net 15.6 % -->
  <rect class="c2" x="212.3" y="296" width="106.7" height="22"/>
  <rect class="c1" x="320" y="296" width="211.0" height="22"/>
  <rect class="c3" x="533.0" y="296" width="113.4" height="22"/>
  <!-- 2048: compute 10.28 %, comm 3.47 %, scheduling 3.56 %, net 17.3 % -->
  <rect class="c1" x="320" y="336" width="142.9" height="22"/>
  <rect class="c2" x="464.9" y="336" width="46.6" height="22"/>
  <rect class="c3" x="513.5" y="336" width="48.8" height="22"/>

  <line class="zero" x1="320" y1="88" x2="320" y2="366"/>

  <g font-size="12" font-weight="600">
    <text class="t1" x="404" y="111">5.4 %</text>
    <text class="t1" x="407" y="151">5.7 %</text>
    <text class="t1" x="380" y="191">3.7 %</text>
    <text class="t1" x="370" y="231">3.0 %</text>
    <text class="t1" x="417" y="271">6.3 %</text>
    <text class="t1" x="654" y="311">15.6 %</text>
    <text class="t1" x="570" y="351">17.3 %</text>
  </g>
  <text class="t2" x="212" y="329" font-size="10">Switching to push alone costs 7.7 %; sending results back early wins it back</text>

  <g class="t2" font-size="11" text-anchor="middle">
    <text x="180" y="380">−10 %</text>
    <text x="250" y="380">−5 %</text>
    <text x="320" y="380">0</text>
    <text x="390" y="380">5 %</text>
    <text x="460" y="380">10 %</text>
    <text x="530" y="380">15 %</text>
    <text x="600" y="380">20 %</text>
    <text x="670" y="380">25 %</text>
  </g>
  <text class="t2" x="425" y="402" font-size="11" text-anchor="middle">Time saved, as % of the better baseline's time (net total at the end of each bar)</text>
  <text class="t2" x="425" y="418" font-size="11" text-anchor="middle">Left of 0: that step made it slower</text>
</svg>
